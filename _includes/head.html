<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  (function() {
    var theme = null;
    try { theme = localStorage.getItem('theme'); } catch (error) {}
    if (theme !== 'dark' && theme !== 'light') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
  })();
</script>

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->

<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v=theme-toggle-20261017-3">
<link rel="stylesheet" href="{{ base_path }}/assets/css/presentation.css?v=20261017-1">

<style>
  /* Keep the mode switch visible even if a cached compiled stylesheet is served. */
  .masthead__inner-wrap { height: 70px; padding-top: 0; padding-bottom: 0; }
  .masthead__menu { display: flex; align-items: center; gap: 16px; height: 100%; padding-right: 0; }
  #site-nav { flex: 1 1 0%; min-width: 0; }
  #theme-toggle {
    position: relative !important;
    z-index: 1 !important;
    top: auto !important;
    right: auto !important;
    flex: 0 0 44px !important;
    margin: 0 !important;
    display: grid !important;
    width: 44px !important;
    height: 44px !important;
    place-items: center !important;
    padding: 0 !important;
    color: var(--site-accent, #46515c) !important;
    background: var(--site-surface, #fff) !important;
    border: 1px solid var(--site-border, #cbd2d8) !important;
    border-radius: 50% !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22) !important;
    cursor: pointer !important;
  }

  #theme-toggle:focus-visible {
    outline: 3px solid var(--site-accent, #52adc8) !important;
    outline-offset: 3px !important;
  }

  #theme-toggle .theme-toggle__icon {
    width: 22px !important;
    height: 22px !important;
    fill: none !important;
    stroke: currentColor !important;
    stroke-linecap: round !important;
    stroke-linejoin: round !important;
    stroke-width: 1.8 !important;
  }

  #theme-toggle .theme-toggle__sun { display: none !important; }
  #theme-toggle .theme-toggle__moon { display: block !important; }

  :root[data-theme="dark"] #theme-toggle {
    color: var(--site-accent, #ffd166) !important;
    background: var(--site-surface, #292e33) !important;
    border-color: var(--site-border, #59636d) !important;
  }

  :root[data-theme="dark"] #theme-toggle .theme-toggle__sun { display: block !important; }
  :root[data-theme="dark"] #theme-toggle .theme-toggle__moon { display: none !important; }

  @media (max-width: 600px) {
    #site-nav .masthead__menu-item--lg { padding-right: 0; }
    #site-nav .masthead__menu-item--lg a {
      max-width: calc(100vw - 180px);
      margin-right: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  }
</style>


<meta http-equiv="cleartype" content="on">
